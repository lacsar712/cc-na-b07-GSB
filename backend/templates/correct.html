{% extends "base.html" %}
{% block body %}
<h1>改正 {{ row.aid_code }}</h1>
<p>要求光强 {{ row.required_cd }}（不变）。改正后服务端重新判定结论。</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form class="card" method="post">
  {% csrf_token %}
  <label>实测光强（坎德拉）</label>
  <input name="measured_cd" type="number" step="0.1" value="{{ row.measured_cd }}" />
  <label>方位偏差（度）</label>
  <input name="bearing_error_deg" type="number" step="0.1" value="{{ row.bearing_error_deg }}" />
  <button type="submit">保存改正</button>
</form>
<p><a href="{% url 'detail' row.pk %}">返回详情</a></p>
{% endblock %}
