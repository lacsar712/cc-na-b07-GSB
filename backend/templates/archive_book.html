{% extends "base.html" %}
{% block body %}
<h1>封存册</h1>
<table>
  <thead><tr><th>编号</th><th>实测光强</th><th>结论</th><th>封存原因</th><th>封存人</th><th>封存时刻</th><th></th></tr></thead>
  <tbody>
  {% for row in rows %}
    <tr>
      <td>{{ row.aid_code }}</td>
      <td>{{ row.measured_cd }}</td>
      <td class="{% if row.verdict == '合格' %}ok{% else %}bad{% endif %}">{{ row.verdict }}</td>
      <td>{{ row.archive_reason }}</td>
      <td>{{ row.archived_by }}</td>
      <td>{{ row.archived_at|date:"Y-m-d H:i:s" }}</td>
      <td><a href="{% url 'detail' row.pk %}">详情</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="7">还没有封存记录</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
